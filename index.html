<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aquacade">
  <title>Aquacade</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <div id="backdrop"></div>

  <main id="play" hidden>
    <header id="topbar">
      <button class="pill" id="btn-home" aria-label="Menu">&#x2630;</button>
      <div id="title"></div>
      <button class="pill" id="btn-reset" aria-label="Reset">&#x21bb;</button>
      <button class="pill" id="btn-camera" aria-label="Toggle see-through camera">&#x25ce;</button>
      <button class="pill" id="btn-sound" aria-label="Toggle sound">&#x266a;</button>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer id="base">
      <div class="side">
        <div class="score" id="score-l"></div>
        <button class="pump" id="pump-l" aria-label="Left pump"><span></span></button>
      </div>
      <div id="base-label"></div>
      <div class="side">
        <div class="score" id="score-r"></div>
        <button class="pump" id="pump-r" aria-label="Right pump"><span></span></button>
      </div>
    </footer>
  </main>

  <section id="menu">
    <h1>Aquacade</h1>
    <p class="tag">Pump the water. Mind the bubbles.</p>
    <div class="games">
      <button class="game" data-mode="rings">
        <svg viewBox="0 0 64 64" aria-hidden="true"><line x1="22" y1="18" x2="22" y2="52" /><line x1="42" y1="18" x2="42" y2="52" /><ellipse cx="22" cy="44" rx="10" ry="3.5" class="r1"/><ellipse cx="42" cy="48" rx="10" ry="3.5" class="r2"/><ellipse cx="32" cy="20" rx="10" ry="6" transform="rotate(-25 32 20)" class="r3"/></svg>
        <b>Ring Toss</b><small>Free play &middot; 1 pump</small>
      </button>
      <button class="game" data-mode="hoops">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="6" width="24" height="18" class="board"/><rect x="12" y="15" width="8" height="7" class="thin"/><path d="M7 25 L10 35 M11.5 25 L13 35 M16 25 L16 35 M20.5 25 L19 35 M25 25 L22 35 M8 28.5 H24 M9 32 H23" class="net"/><ellipse cx="16" cy="25" rx="9" ry="2.2" class="rim"/><rect x="36" y="6" width="24" height="18" class="board"/><rect x="44" y="15" width="8" height="7" class="thin"/><path d="M39 25 L42 35 M43.5 25 L45 35 M48 25 L48 35 M52.5 25 L51 35 M57 25 L54 35 M40 28.5 H56 M41 32 H55" class="net"/><ellipse cx="48" cy="25" rx="9" ry="2.2" class="rim"/><path d="M2 47 L20 53 L18 62 M62 47 L44 53 L46 62 M26 62 L32 49 L38 62" class="rail"/><circle cx="32" cy="40" r="5" class="ball"/><path d="M27 40 H37 M32 35 V45 M29 36 Q31.5 40 29 44 M35 36 Q32.5 40 35 44" class="seam"/></svg>
        <b>Basketball</b><small>2-player &middot; first to 10</small>
      </button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="opt-camera"> See-through case <small>(uses rear camera)</small></label>
      <label><input type="checkbox" id="opt-tilt"> Tilt to steer</label>
      <label><input type="checkbox" id="opt-sound"> Sound</label>
    </div>
    <p class="fine">Camera video stays on your device and is never recorded.</p>
  </section>

  <div id="win" hidden>
    <div class="card">
      <h2 id="win-msg"></h2>
      <button id="btn-again">Play again</button>
    </div>
  </div>

  <div id="campanel" hidden>
    <label for="cam-zoom">Zoom</label>
    <input type="range" id="cam-zoom" min="0.5" max="3" step="0.05">
    <output id="cam-zoom-val">1.0×</output>
    <button id="cam-off">Off</button>
  </div>

  <div id="toast" hidden></div>
  <div id="rotate">Turn your phone upright</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
